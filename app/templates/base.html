<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A private reading history and semantic book recommender.">
    {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
    <title>{% block title %}Book-recommender{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
    <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Book-recommender home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Book-recommender</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Discover</a>
        <a href="/read" {% if request.url.path == '/read' %}aria-current="page"{% endif %}>Read books</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>
      <span>Book-recommender</span>
      <span>Semantic recommendations, stored privately.</span>
    </footer>
    {% block dialogs %}{% endblock %}
  </body>
</html>
