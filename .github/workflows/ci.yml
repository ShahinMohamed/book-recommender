name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_DB: book_recommender_test
          POSTGRES_USER: book_recommender
          POSTGRES_PASSWORD: book-recommender-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U book_recommender -d book_recommender_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgresql+psycopg://book_recommender:book-recommender-ci@127.0.0.1:5432/book_recommender_test
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-ingest.txt scikit-learn==1.9.0 scipy==1.18.1 httpx==0.28.1 pytest==8.4.2 ruff==0.13.2
      - run: ruff check app scripts tests
      - run: alembic upgrade head
      - run: python -m scripts.ingest --dataset data/demo_books.csv --embeddings data/demo_embeddings.npy --metadata data/demo_embeddings_metadata.json
      - run: pytest -q
      - run: docker build --target runtime -t book-recommender:${{ github.sha }} .
