name: book-recommender

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-book_recommender}
      POSTGRES_USER: ${POSTGRES_USER:-book_recommender}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  migrate:
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment: &app-environment
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-book_recommender}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-book_recommender}
      SECRET_KEY: ${SECRET_KEY:?Copy .env.example to .env and set SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  seed:
    build:
      context: .
      target: ingestion
    command: ["--dataset", "data/demo_books.csv", "--embeddings", "data/demo_embeddings.npy", "--metadata", "data/demo_embeddings_metadata.json"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks: [backend]

  web:
    build:
      context: .
      target: runtime
    environment: *app-environment
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend, edge]

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  edge:
